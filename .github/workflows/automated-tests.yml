name: Automated tests

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Launch matrix server and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      
      - name: Build Docker image
        run: docker build -t mactrix-test-server scripts/test-server
      
      - name: Start container
        run: |
          docker run -d --name test-server \
            mactrix-test-server \
            tail -f /dev/null
      
      - name: Start Matrix server
        run: |
          docker exec -w /test-server test-server nix-shell --run "MATRIX_PID_FILE=./matrix-server.pid MATRIX_LOG_FILE=./matrix-server.log ./run-matrix-server.sh" > ./matrix-startup.log 2>&1 &
      
      - name: Populate Matrix server
        run: docker exec -w /test-server test-server nix-shell --run "./populate-matrix-server.py"
      
      # TODO: run tests here
      
      - name: Stop Matrix server
        if: always()
        run: |
          docker exec -w /test-server test-server sh -c 'if [ -f ./matrix-server.pid ]; then kill $(cat ./matrix-server.pid); fi' || true
      
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Server startup log ==="
          cat ./matrix-startup.log 2>/dev/null || echo "No startup log found"
          echo ""
          echo "=== Server log (conduwuit) ==="
          docker exec -w /test-server test-server cat ./matrix-server.log 2>/dev/null || echo "No server log found"
          echo ""
          echo "=== Container logs ==="
          docker logs test-server 2>&1 || echo "No container logs"
      
      - name: Cleanup container
        if: always()
        run: docker rm -f test-server || true
